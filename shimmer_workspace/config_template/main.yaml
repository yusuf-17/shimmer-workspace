# Path where we save checkpoints
default_root_dir: "/mnt/datashare/yelhelw/checkpoints"


dataset:
    # Path to the simple-shapes-dataset
    path: "/mnt/datashare/yelhelw/complex_dataset_V3"

    
wandb:
    enabled: True  # Set to true to log your training to wandb
    save_dir: "/mnt/datashare/yelhelw/wandb"
    project: "shimmer-meta"
    entity: "yusuf-pcms-university-of-toulouse"


# Uncomment the following to use mixed-precision for training:
#training:
#    precision: "16-mixed"
#    float32_matmul_precision: "medium"


# Config for the dataloader
domain_data_args:
    v_latents:
        presaved_path: domain_v.npy
    attr_latents:
        presaved_path : domain_attr.npy


# Config for the domain modules
domain_modules:
    text:
        vocab_path: ./tokenizer/vocab.json
        merges_path: ./tokenizer/merges.txt


# Proportion used for each group of domain
# Possible options are "v", "attr", "t"
domain_proportions: 
    -   domains: ["v", "attr"]  # paired passes uses 100% of the available data
        proportion: 1.0
    -   domains: ["v", "attr","act"]  # paired passes uses 100% of the available data
        proportion: 0.4


# Selected domains for this run
#domains:
#    - checkpoint_path: "pretrained/domain_v_pov.ckpt"
#      domain_type: 'v_latents'
#    - checkpoint_path: "pretrained/domain_attr.ckpt"
#      domain_type: 'attr'
#    - checkpoint_path: "pretrained/domain_act.ckpt"
#      domain_type: 'act'


global_workspace:
    # Dimension of the global workspace
    latent_dim: 12

    # Coefficients of the various losses
    loss_coefficients:
        cycles: 0.1
        contrastives: 0.5
        demi_cycles: 1.0
        translations: 1.0
        fused: 0.1

    # Global Workspace encoder settings
    encoders:
        # You can either set the hidden_dim or n_layers for each domain,
        # or directly (like in `decoders` below) if it is the same for every domain.
        hidden_dim:
            v_latents: 32
            attr : 32
            act: 32
        # Number of layers - 2 additional linear layer that will always be added 
        # (the total will be n_layers + 2).
        n_layers:
            v_latents: 2
            attr: 2
            act: 2

    # Global Workspace decoder settings
    # The comments are the same as for the encoders
    decoders:
        hidden_dim: 
            v_latents: 32
            attr: 32
            act: 32
        n_layers: 
            v_latents: 2
            attr: 2
            act: 2
      


